  - id: uboot-load-addresses
    section: quick-facts
    title: U-Boot load addresses
    critical: true
    claim: >-
      Mainline U-Boot's RK3588 environment: `kernel_addr_r=0x02000000`, `fdt_addr_r=0x12000000`,
      `fdtoverlay_addr_r=0x12100000`, `ramdisk_addr_r=0x12180000`, `kernel_comp_addr_r=0x0a000000`
      with `kernel_comp_size=0x8000000`, `scriptaddr=0x00c00000` and `pxefile_addr_r=0x00e00000`.
    support:
      - class: src
        anchors:
          - {repo: u-boot, path: include/configs/rk3588_common.h, lines: [21, 31], symbol: ENV_MEM_LAYOUT_SETTINGS}
    scope:
