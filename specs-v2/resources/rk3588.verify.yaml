      the claim does not contradict). Scope is stated as TF-A v2.14. One wording caution: "BL31 occupies
      0x40000-0xFFFFF" and "BL31 ends at TZRAM_BASE + TZRAM_SIZE" describe the region BL31 is placed
      in and bounded by (BL31_BASE to BL31_LIMIT), not the loaded image''s size; the address conclusion
      is unaffected. TODO (SCMI clock-rate read from Linux under mainline TF-A) can observe it.'
