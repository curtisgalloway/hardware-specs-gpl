    note: 'Mode DELTA (upstream changed: docs stock-loader and uart2-state-at-handoff; the second
      adds a TODO to run the byte test under both loaders, consistent with this claim''s own scope).
      The stated premises follow as before. Contrary search found a condition the derivation does
      not name: in the vendor tree arch/arm/mach-rockchip/Kconfig:1060-1064 ROCKCHIP_PRELOADER_SERIAL
      defaults to y with ATAGs, and param.c:418-443 plus board.c:520-525 mean that when the preloader
      (a Rockchip binary, not read) supplies a serial ATAG, U-Boot takes the console address and baud
      from it, skips debug_uart_init(), and disables the console if the ATAG says so. So the UART
