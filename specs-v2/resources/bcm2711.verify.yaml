  ppi-flags-are-not-hardware-polarity:
    basis: 9f647a8011d28df136af68b8908c2e6c6db79d9a7ea227dbbfea5cd75cddf0c8
    upstream:
      bcm2711@hardware-specs-docs#interrupt-ids-at-the-gic: dc2a16810cf2239d29eea67c93c7190b6b9b9fb9858da38d3c89a403b4d102be
    verdict: PASS
    date: '2026-10-08'
    verifier: Claude Opus 5.5, Claude Code subagent (delta verification of d4721e5 against the 89557f7
      record; second reader run separately)
    note: 'now an `[inference]`. Premise 1

      holds: bcm2711.dtsi lines 64-65 encode the maintenance interrupt GIC_PPI 9 with

      IRQ_TYPE_LEVEL_HIGH and lines 446-453 encode the four timer PPIs with IRQ_TYPE_LEVEL_LOW.

      Premise 2 holds: the docs spec (at e7529fe) has a Quick-facts bullet "Interrupt IDs at the GIC"

      stating that PPI inputs are active-low level-sensitive, cited to the GIC-400 TRM §2.3.2, and
      the

      TRM''s §2.3.2 does say all PPI signals are active-low level-sensitive; "fixed" is no longer

      claimed. Premise 3 holds: the nested anchor resolves at the pin (arm,gic.yaml lines 82-94, the

      third-cell flags under `#interrupt-cells`), and those lines say PPI configurability is

      implementation defined and that most SoCs of 2014 ignore the flag and use the hardware default.

      The derivation follows: inputs that share one polarity cannot all match two different flags,
      so

      the flags do not convey polarity, and the binding supports not expecting a write to take

      effect. `TODO (verify on hardware)` present. Contrary glance: the GIC-400 TRM''s distributor

      register summary (§3.3, Table 3-2) lists GICD_ICFGR1 (the PPI word) as read-only with reset
      value 0x55540000,

      which agrees with the conclusion and means the hardware TODO should read back that value.'
    carried_from:
      repo: hardware-specs-gpl
      commit: ee658356abb8527b90bf8000cfca9f07f2657553
      path: specs/resources/bcm2711.verify.md
      key: Quick-facts/3 "PPI flags are not hardware polarity"
      format: 1
