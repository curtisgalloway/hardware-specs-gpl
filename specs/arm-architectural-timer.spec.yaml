  critical: true
- id: firing-condition
  section: interrupts
  title: Timer firing and mask semantics
  claim: The guide states the timer condition is CVAL less than or equal to the count. CTL ENABLE enables
    the timer, IMASK masks interrupt generation, and ISTATUS reports the firing condition when ENABLE
    is one. To generate an interrupt, set ENABLE to one and IMASK to zero. Timer interrupts are private
    to the originating core and level-sensitive.
  support:
  - class: doc
    doc: arm-generic-timer-102379-0104.pdf
    at:
    - section: 4.4 Configuring a timer
      page: '12'
  - class: doc
    doc: arm-generic-timer-102379-0104.pdf
