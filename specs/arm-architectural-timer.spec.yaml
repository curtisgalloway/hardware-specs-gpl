      page: '12'
  - class: doc
    doc: arm-generic-timer-102379-0104.pdf
    at:
    - section: 4.5 Interrupts
      page: '13'
  requirement: hw-required
  critical: true
- id: clear-before-gic-deactivation
  section: interrupts
  title: Remove the timer signal before GIC deactivation
  claim: The guide requires clearing the timer interrupt before deactivating it in the GIC. Set IMASK,
    clear ENABLE, or write TVAL/CVAL so the firing condition is no longer met; otherwise the GIC can signal
    the interrupt again. The timer control/status handling is distinct from GIC acknowledgment and deactivation.
  support:
  - class: doc
    doc: arm-generic-timer-102379-0104.pdf
    at:
    - section: 4.5 Interrupts
      page: '13'
  - class: doc
    doc: arm-generic-timer-102379-0104.pdf
    at:
    - section: 7 Example using Arm Development Studio
      page: '25'
  requirement: hw-required
  critical: true
- id: ppi-selection
  section: interrupts
  title: Linux PPI selection is conditional
  claim: In arch_timer_select_ppi, a kernel in hyp mode uses the hypervisor virtual PPI if available and
    has_broken_el2_vtimer is false, otherwise the hypervisor physical PPI. Outside that branch, lack of
    hyp availability plus an available virtual PPI selects the EL1 virtual PPI; otherwise CONFIG_ARM64
    selects the nonsecure physical PPI, with the secure physical PPI as the remaining non-arm64 fallback.
    This is driver policy, not evidence of the actual ROCK5T entry mode.
  support:
  - class: src
    anchors:
    - repo: linux
      path: drivers/clocksource/arm_arch_timer.c
      lines:
      - 1136
      - 1153
      symbol: arch_timer_select_ppi
  requirement: as-implemented
  critical: true
- id: broken-el2-vtimer-guard
  section: gotchas
  title: Hypervisor virtual timer exclusion guard
  claim: The has_broken_el2_vtimer helper returns true for an of_machine_compatible_match against its
    brcm,bcm2712 list, taints the kernel and warns; otherwise it returns false. This describes the guard
    called by PPI selection and does not assert any RK3588 timer erratum.
  support:
