- id: processor-timer-scope
  section: identity
  title: Processor timer scope
  claim: The guide describes a common System Counter broadcast to per-core comparators, with EL1 physical
    and virtual timers always present. This peripheral covers their AArch64 programming and the pinned
    Linux system-register path; it does not specify external MMIO timer frames.
  support:
  - class: doc
    doc: arm-generic-timer-102379-0104.pdf
    at:
    - section: 3 What is the Generic Timer?
      page: '8'
  - class: doc
    doc: arm-generic-timer-102379-0104.pdf
    at:
    - section: 3 What is the Generic Timer?
      page: '9'
  - class: doc
    doc: arm-generic-timer-102379-0104.pdf
    at:
    - section: 4 The processor timers
      page: '10'
  - class: doc
    doc: arm-generic-timer-102379-0104.pdf
    at:
    - section: 6 External timers
      page: '22'
- id: instance-topology
  section: identity
  title: RK3588 timer topology pointer
  claim: RK3588 timer interrupt wiring and node properties are recorded by the referenced SoC fact. This
    spec adds programming behavior, not an MMIO base or proof of the boot firmware state.
  support:
  - class: inference
    confidence: high
    premises:
    - fact: rk3588@hardware-specs-gpl#dt-timer-node
      uses: timer node interrupt names and properties
    derivation: The SoC fact supplies the instance topology; timer programming is kept in this peripheral.
  todo:
    check: hardware
    text: Confirm the timer node used at actual kernel entry matches the pinned SoC topology.
  relates:
  - fact: rk3588@hardware-specs-gpl#dt-timer-node
    relation: qualifies
- id: physical-count-and-frequency
  section: sub-protocols
  title: Physical count and frequency
  claim: 'CNTPCT_EL0 reports the physical system count. CNTFRQ_EL0 reports its frequency but hardware
    does not populate it: early firmware must set it, typically at EL3; the guide permits writes at the
    highest implemented exception level. The count is 56 to 64 bits wide; this does not establish the
    implemented RK3588 width or frequency.'
  support:
  - class: doc
    doc: arm-generic-timer-102379-0104.pdf
    at:
    - section: 4.1 Count and frequency
      page: '10'
  - class: doc
    doc: arm-generic-timer-102379-0104.pdf
    at:
    - section: 3 What is the Generic Timer?
      page: '8'
  requirement: hw-required
  critical: true
- id: virtual-count-offset
  section: sub-protocols
  title: Virtual count has its own time domain
  claim: The virtual count is physical count minus CNTVOFF_EL2. The guide restricts access to that offset
    to EL2 or EL3; without EL2 the offset is fixed to zero. Physical timers compare with physical count,
    virtual timers with virtual count. No actual firmware offset is asserted.
  support:
  - class: doc
    doc: arm-generic-timer-102379-0104.pdf
    at:
    - section: 4.6 Timer virtualization
      page: '13'
  - class: doc
    doc: arm-generic-timer-102379-0104.pdf
    at:
    - section: 4.6 Timer virtualization
      page: '14'
  requirement: hw-required
  critical: true
