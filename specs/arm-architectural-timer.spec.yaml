      symbol: has_broken_el2_vtimer
  requirement: as-implemented
- id: counter-choice
  section: sub-protocols
  title: Clocksource counter selection differs from PPI selection
  claim: arch_counter_register chooses the virtual counter when CONFIG_ARM64 is enabled and hyp mode is
    unavailable, or when the selected PPI is virtual or hypervisor virtual. Otherwise it chooses the physical
    counter. Each branch selects stable reader variants when arch_timer_counter_has_wa is true and direct
    variants otherwise. Counter choice must be evaluated separately from timer interrupt choice.
  support:
