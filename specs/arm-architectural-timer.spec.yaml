- id: counter-read-order
  section: sub-protocols
  title: Counter read branches
  claim: The arm64 normal read functions use ISB then MRS CNTPCT_EL0 or CNTVCT_EL0. Their ARM64_HAS_ECV
    alternatives use NOP and the corresponding CNTPCTSS_EL0 or CNTVCTSS_EL0 access. The direct and stable
    wrappers then call arch_counter_enforce_ordering with the read count; that helper implementation is
    not specified here.
  support:
  - class: src
    anchors:
