- id: dt-init-and-failure
  section: gotchas
  title: Linux DT initialization and early exits
  claim: arch_timer_of_init skips a duplicate node when arch_timer_evt exists. It resolves interrupts
    by names if interrupt-names exists, otherwise by enum index, retaining only positive IRQ results.
    It derives c3stop from absence of always-on, checks DT workarounds, and only CONFIG_ARM with arm,cpu-registers-not-fw-configured
    forces the secure physical PPI; otherwise it calls arch_timer_select_ppi. Missing selected interrupt
    returns EINVAL. It reads arm,no-tick-in-suspend, propagates arch_timer_register failure, and calls
    common initialization only after registration succeeds.
  support:
  - class: src
    anchors:
    - repo: linux
      path: drivers/clocksource/arm_arch_timer.c
      lines:
