format: 2
kind: peripheral
id: arm-architectural-timer
name: Arm architectural timer hardware programming
orientation: 'Terms: system register means a named CPU register accessed by MRS/MSR; PPI means an interrupt
  private to a core; EL means exception level, a processor privilege level; CVAL is absolute compare value;
  TVAL is relative timer value. See the repository glossary. Scope: hardware programming for the standard
  ROCK 5T V1.2 campaign; target OS integration is open. Ordinary facts describe system registers because
  the format register payload requires an MMIO offset. No measured firmware state or hardware test is
  claimed.'
resources:
  documents:
  - name: arm-generic-timer-102379-0104.pdf
    class: doc
    title: Learn the architecture - Generic Timer
    revision: 102379_0104_01_en version 1.4 issue 01
    url: https://developer.arm.com/documentation/102379/latest
    retrieval:
    - url: https://documentation-service.arm.com/static/66c4754f32f35b31ceb317ff
    sha256: c8fb557a14970b8302e2f12560fc9038d650da9aaaf97d4bb85327bfa401e82c
    pages: 28
    page_numbering: printed
    access: public
    note: Non-confidential public programming guide. Does not establish CPU extension availability or
      actual firmware state; no claim cites the rejected retired DDI0608 supplement.
  repos:
  - name: linux
    url: https://github.com/torvalds/linux
    commit: 8d3ae59288f1e7d58d76558a6ee96d533bc5019f
    license: GPL-2.0-only
    role: source
    files:
    - path: drivers/clocksource/arm_arch_timer.c
      license_from: spdx-line
    - path: include/clocksource/arm_arch_timer.h
      license_from: spdx-line
    - path: arch/arm64/include/asm/arch_timer.h
      license_from: spdx-line
