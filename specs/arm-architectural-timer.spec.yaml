- id: physical-read-isb
  section: sub-protocols
  title: Order-sensitive physical count reads
  claim: The guide warns that CNTPCT_EL0 reads can be speculative and shows an ISB before MRS when the
    read must follow preceding program flow. Its self-synchronizing CNTPCTSS_EL0 is a newer architectural
    feature; applicability to a particular CPU must be established before choosing it.
  support:
  - class: doc
    doc: arm-generic-timer-102379-0104.pdf
    at:
    - section: 4.1 Count and frequency
      page: '10'
  requirement: hw-required
  critical: true
- id: compare-and-relative-registers
  section: sub-protocols
  title: Compare and relative timer registers
  claim: The guide names CNTP_CTL_EL0, CNTP_CVAL_EL0 and CNTP_TVAL_EL0 for the EL1 physical timer, and
    CNTV_CTL_EL0, CNTV_CVAL_EL0 and CNTV_TVAL_EL0 for the EL1 virtual timer. CVAL is 64 bits; TVAL is
    32 bits. Writing TVAL populates CVAL from current count plus the written value; reading TVAL returns
    a signed decrementing value. CVAL and TVAL are two views of the same timer. No reset values or system-register
    instruction encodings are supplied.
  support:
  - class: doc
    doc: arm-generic-timer-102379-0104.pdf
    at:
    - section: 4.2 Timer registers
      page: '11'
  - class: doc
    doc: arm-generic-timer-102379-0104.pdf
    at:
    - section: 4.4 Configuring a timer
      page: '12'
  requirement: hw-required
  critical: true
- id: control-bit-definitions
  section: sub-protocols
  title: Linux control bit positions
  claim: The Linux header defines ARCH_TIMER_CTRL_ENABLE at bit 0, ARCH_TIMER_CTRL_IT_MASK at bit 1 and
    ARCH_TIMER_CTRL_IT_STAT at bit 2. These definitions supply the masks used by the source sequences.
  support:
  - class: src
    anchors:
    - repo: linux
      path: include/clocksource/arm_arch_timer.h
      lines:
