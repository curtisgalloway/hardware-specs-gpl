- id: power-clock-order
  section: gotchas
  claim: Linux runtime suspend disables baud clock then APB clock. Resume enables APB clock first then
    baud clock; on baud-clock failure it disables APB again. set_termios requests baud * 16 as the clock
    rate, disabling and reenabling baudclk around rate negotiation before termios programming.
  requirement: as-implemented
