facts:
- id: console-route
  section: identity
  claim: Apply this programming description to the board console only after resolving the board and SoC
    route facts. The cited board selects UART2 M0; its physical connector and the SoC instance map remain
    in their owning specs.
  todo:
    check: hardware
    text: Confirm standard V1.2 identity and active UART2 M0 mux before using the connector.
  support:
  - class: inference
    confidence: high
    premises:
    - fact: rock5t@hardware-specs-gpl#dt-console
      uses: board console selects UART2 M0
    - fact: rock5t@hardware-specs-docs#debug-console-is-uart2-m0
      uses: physical debug-console route
    - fact: rk3588@hardware-specs-gpl#dt-uart2-node
      uses: UART2 instance, clocks and register properties
    - fact: rk3588@hardware-specs-gpl#dt-uart2-m0-pins
      uses: M0 pin group
    derivation: These facts identify the board route and instance to which the programming model is applied;
      this does not prove the running firmware selected that route.
  critical: true
- id: addressing
  section: identity
  claim: The register table uses byte offsets for UART2 reg-shift 2. U-Boot scales each logical slot by
    1 << reg_shift, adds reg_offset, and defaults reg_offset to zero. With CONFIG_NS16550_DYNAMIC and
    NS16550_FLAG_IO clear, its reg_width == 4 branch uses 32-bit accesses; IO mode takes the preceding
    byte-access branch. Linux dw8250_serial_in32/out32 use readl/writel at membase + (index << regshift).
    Extended DLF/CPR/UCV offsets bypass regshift. Width means observed transaction size, not proved silicon
    width.
  requirement: as-implemented
  relates:
  - fact: rk3588@hardware-specs-gpl#dt-uart2-node
    relation: refines
  support:
  - class: src
    anchors:
