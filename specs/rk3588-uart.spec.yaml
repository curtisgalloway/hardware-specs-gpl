format: 2
kind: peripheral
id: rk3588-uart
name: RK3588 UART console programming observations
orientation: Hardware programming only for standard ROCK 5T V1.2. Source observations are bounded to the
  generic U-Boot NS16550 and Linux DesignWare 8250 paths at the pins below. Offsets are byte offsets for
  the instance register shift; logical register indices and direct extension byte offsets must remain
  distinct. No confidential manual is cited. Independent verification is pending.
areas:
- area: console programming
  level: code-only
  note: Accepted implementation sources establish operations; silicon requirements and firmware state
    remain explicit gaps.
