- id: basic-aliases
  section: gotchas
  claim: U-Boot aliases THR and DLL to RBR, IIR to FCR, and DLM to IER. Its divisor writer selects DLAB
    before DLL/DLM accesses and restores LCR afterward. Register rows describe these software names, not
    simultaneous independent registers; do not read FCR through the IIR alias as a saved FIFO-control
    value.
  requirement: as-implemented
  support:
  - class: src
    anchors:
