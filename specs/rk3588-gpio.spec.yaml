- id: split-access
  section: gotchas
  claim: For GPIO_TYPE_V2 the whole logical write emits (value & 0xffff) | 0xffff0000 at r, then (value
    >> 16) | 0xffff0000 at r+4. For pin p, the bit helper uses r+4 only when p>=16; mask is BIT(p%16+16),
    with BIT(p%16) included only for a nonzero value. A clear therefore emits a mask-only word, not zero.
    The logical read computes (readl(r+4)<<16) | readl(r); the implementation does not mask either read
    to 16 bits. Its use treats lower halves as the two pin groups, but upper-half read behavior remains
    a hardware gap. Other gpio_type values use single-word reads/writes and read-modify-write for a bit.
  requirement: as-implemented
  support:
  - class: src
    anchors:
    - repo: linux-gpio
      path: drivers/gpio/gpio-rockchip.c
      lines:
      - 71
      - 137
      symbol: gpio_writel_v2
  critical: true
- id: v1-boundary
  section: gotchas
  claim: 'ID zero uses the separate v1 table: port_dr 0x0, port_ddr 0x4, int_en 0x30, int_mask 0x34, int_type
    0x38, int_polarity 0x3c, int_status 0x40, int_rawstatus 0x44, debounce 0x48, port_eoi 0x4c and ext_port
    0x50. V1 has no v2 both-edge/divider/version entries in that table. This spec does not provide a typed
    v1 map or claim v1 applies to RK3588; zero detection is only the Linux branch boundary.'
  requirement: as-implemented
  support:
  - class: src
    anchors:
    - repo: linux-gpio
      path: drivers/gpio/gpio-rockchip.c
      lines:
      - 34
      - 34
      symbol: GPIO_TYPE_V1
    - repo: linux-gpio
      path: drivers/gpio/gpio-rockchip.c
      lines:
      - 39
      - 51
      symbol: gpio_regs_v1
    - repo: linux-gpio
      path: drivers/gpio/gpio-rockchip.c
      lines:
      - 689
      - 695
      symbol: rockchip_get_bank_data
  critical: true
- id: direction-and-data
  section: sequences
  claim: Linux sets output data before selecting output direction. Its direction bit value is zero for
    input and one for output. Input sampling reads ext_port directly as one 32-bit word, shifts by pin
    offset and masks bit zero; it does not use the split read helper.
  requirement: as-implemented
  support:
  - class: src
    anchors:
    - repo: linux-gpio
      path: drivers/gpio/gpio-rockchip.c
      lines:
      - 139
      - 196
      symbol: rockchip_gpio_get_direction
    - repo: linux-gpio
      path: drivers/gpio/gpio-rockchip.c
      lines:
      - 259
      - 271
      symbol: rockchip_gpio_direction_output
  critical: true
  data:
    sequence:
      steps:
      - id: output-value
        action: Call the port_dr bit setter for the requested output value under the bank spinlock.
      - id: output-direction
        action: Then call the port_ddr bit setter with one, under the bank spinlock.
      - id: input-alternative
        action: For input instead, write zero to the port_ddr bit; get_direction reports zero as input
          and nonzero as output.
      - id: input-sample
        action: Read ext_port directly, shift by the requested pin offset and return bit zero.
      order:
      - before: output-value
        after: output-direction
        requirement: as-implemented
        support:
        - class: src
          anchors:
          - repo: linux-gpio
            path: drivers/gpio/gpio-rockchip.c
            lines:
            - 139
            - 196
