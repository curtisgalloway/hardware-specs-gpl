  critical: true
  data:
    sequence:
      steps:
      - id: input
        action: Write zero to the selected port_ddr bit.
      - id: read-config
        action: Read logical int_type and int_polarity under lock.
      - id: both-edge
        action: For v2 both-edge set int_bothedge and return via out; otherwise clear it before selecting
          single-edge/level configuration.
      - id: single-type
        action: For a supported single type update the bit pair, write int_type then int_polarity; on
          an unsupported type exit with -EINVAL without these two writes.
      order:
