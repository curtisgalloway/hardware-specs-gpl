- id: interrupt-initialization
  section: sequences
  claim: Linux IRQ registration chooses v2 split register callbacks only for GPIO_TYPE_V2, uses int_mask
    for masking and port_eoi for acknowledgement, then writes all mask bits, all EOI bits and all enable
    bits in that order. This is driver policy, not a hardware reset state or a proven mandatory hardware
    order.
  requirement: as-implemented
  support:
  - class: src
    anchors:
    - repo: linux-gpio
      path: drivers/gpio/gpio-rockchip.c
      lines:
      - 519
      - 572
      symbol: rockchip_interrupts_register
  critical: true
  data:
    sequence:
      steps:
      - id: callbacks
        action: Create a 32-line domain and generic chip, then assign register dispatch, mask/ack offsets
          and callbacks.
      - id: mask-all
        action: Write 0xffffffff to int_mask using the revision-dependent helper.
      - id: ack-all
        action: Write 0xffffffff to port_eoi using that helper; this is an acknowledgement operation intended
          to discard pending events.
      - id: enable-all
        action: Write 0xffffffff to int_en, set the mask cache to all ones and attach the chained bank
          handler.
      order:
      - before: callbacks
        after: mask-all
        requirement: as-implemented
        support:
        - class: src
          anchors:
          - repo: linux-gpio
            path: drivers/gpio/gpio-rockchip.c
            lines:
