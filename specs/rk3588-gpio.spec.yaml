- id: bank-setup
  section: sequences
  claim: Linux probe waits for its parent pinctrl device, finds the bank by GPIO alias (or fallback enumeration),
    maps the bank resource and IRQ, obtains its enabled first clock, then identifies register revision.
    V2 also acquires the second clock and installs a managed clk_put action; this acquisition alone does
    not enable debounce.
