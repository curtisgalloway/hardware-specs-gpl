- id: register-hardware-semantics
  section: open-questions
  claim: No admissible public document here establishes reset values, physical register widths, upper-half
    read behavior, reserved-bit effects, EOI write-one-clear behavior or IRQ loss/race ordering. int_rawstatus
    is only an offset definition; no raw/status mask formula is adopted from the header comment.
  todo:
    check: document
    text: No admissible public document here establishes reset values, physical register widths, upper-half
      read behavior, reserved-bit effects, EOI write-one-clear behavior or IRQ loss/race ordering. int_rawstatus
      is only an offset definition; no raw/status mask formula is adopted from the header comment.
    method: Find a nonconfidential applicable public GPIOv2 manual; independently test selected owned
      lines for masked events, EOI behavior and split read/write semantics without relying on source comments.
