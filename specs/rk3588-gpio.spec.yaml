- id: interrupt-mask-ack
  section: interrupts
  claim: 'The assigned generic mask callback ORs the requested mask into the cache and writes the full
    cache; unmask clears those bits and writes the full cache. The assigned acknowledgement callback writes
    d->mask to port_eoi without reading EOI first. irq_reg_writel dispatches through gc->reg_writel when
    set; Linux selects gpio_writel_v2 for v2, so acknowledgement emits both physical halves with all update
    masks, setting data only for requested pending bits. Do not interpret write-mask clearing as interrupt
    acknowledgement: acknowledgement data contains ones. These are the driver operations; hardware W1C
    side effects and race behavior require validation.'
  requirement: as-implemented
  support:
