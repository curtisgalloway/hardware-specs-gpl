      - id: parent
        action: Require a parent node and available pinctrl device; absence of the latter returns -EPROBE_DEFER.
      - id: bank
        action: Resolve GPIO alias or fallback bank ID and initialize its spinlock.
      - id: resources
        action: Translate and map resource zero, map interrupt zero, and obtain the enabled first clock;
          failures return before the VERSION read.
      - id: revision
