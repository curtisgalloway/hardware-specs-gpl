- id: interrupt-status-demux
  section: interrupts
  claim: The bank handler reads int_status directly with readl_relaxed, scans up to 32 pending bits and
    calls generic_handle_domain_irq for each before chained_irq_exit. It does not use the split helper
    for status or read int_rawstatus here. V1 both-edge instead sets toggle_edge_mode, reads external
    level and adjusts polarity; the demux repeats that adjustment until the observed input bit is stable.
    This software toggling branch is distinct from v2 int_bothedge.
