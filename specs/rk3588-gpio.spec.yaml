    text: Actual GPIO VERSION IDs, mapped accessibility and matching programming semantics on standard
      ROCK 5T V1.2 remain unmeasured. The conditional Linux v2 model is not confirmation of installed
      silicon revision.
    method: With authorized firmware and known clock/power ownership, read VERSION at each declared bank
      and retain board revision, execution level, firmware and exact values; compare against the three
      supported IDs. This establishes only the discriminator and access at that location. Establish matching
      programming semantics separately through the public-document investigation and scoped, safe, explicitly
      owned-line tests described by register-hardware-semantics and pin-ownership-electrical.
