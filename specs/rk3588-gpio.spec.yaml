- id: debounce-programming
  section: sequences
  claim: When v2 has a usable second clock, Linux computes maximum debounce as (GENMASK(23,0)+1)*2*1000000/freq,
    rejects larger requests, and computes divider as round-closest(debounce*freq/(2*USEC_PER_SEC))-1.
    For nonzero debounce it only raises the existing divider to the consumer maximum, enables the pin
    divider bit and debounce bit, then calls clk_prepare_enable for the second clock without checking
    its return value. Zero clears divider/debounce bits then calls clk_disable_unprepare for that clock.
    Without divider support it only toggles the debounce bit. No exact physical pulse filter guarantee
    follows.
  requirement: as-implemented
  support:
  - class: src
    anchors:
    - repo: linux-gpio
      path: drivers/gpio/gpio-rockchip.c
      lines:
      - 198
      - 256
      symbol: rockchip_gpio_set_debounce
  critical: true
  data:
    sequence:
      steps:
      - id: calculate
        action: Compute the frequency-based supported limit and divider before acquiring the bank lock.
      - id: configure
        action: For nonzero delay, directly read dbclk_div_con and write the requested divider only if
          larger, then set dbclk_div_en when supported and debounce; zero clears the corresponding bits.
      - id: clock-last
        action: After unlocking, call clk_prepare_enable or clk_disable_unprepare for db_clk last when
          divider support exists; the enable return value is ignored.
      order:
      - before: calculate
        after: configure
        requirement: as-implemented
        support:
