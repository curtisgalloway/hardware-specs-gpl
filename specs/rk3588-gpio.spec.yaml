      lines:
      - 71
      - 137
      symbol: gpio_writel_v2
  critical: true
  data:
    register:
      name: port_dr
      offset: '0x0'
    fields:
    - id: half-data
      name: half_data
      bits:
      - 0
      - 15
      meaning: In a v2 write word, these are value bits for pins 0..15 at the logical offset or 16..31
        at offset+4. Linux whole-register writes supply all 16; single-pin writes set only the selected
        bit when value is nonzero.
    - id: half-mask
      name: half_write_mask
      bits:
      - 16
      - 31
      meaning: Linux v2 writes set a mask bit here to select the corresponding lower-half bit for update;
        single-pin clear writes only that mask bit, whereas set writes mask and data. The upper half is
        not a second group of pin values in this write word.
