- id: interrupt-type
  section: sequences
  claim: Linux first forces the selected GPIO direction to input. V2 both-edge sets the int_bothedge bit
    and jumps past int_type/int_polarity writes. For other types v2 first clears int_bothedge. Rising
    sets type/polarity 1/1, falling 1/0, high level 0/1, low level 0/0. Invalid types return -EINVAL after
    the preceding input-direction and both-edge changes; the callback is not transactional.
  requirement: as-implemented
  support:
