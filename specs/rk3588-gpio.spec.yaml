format: 2
kind: peripheral
id: rk3588-gpio
name: 'RK3588 GPIO: conditional Linux GPIOv2 programming model'
orientation: Hardware-only scope for standard Radxa ROCK 5T V1.2. This source description is conditional
  on runtime version detection; it does not establish actual silicon applicability or provide an implementation-ready
  board recipe. Industrial revisions and other boards are outside scope. No board pin is assumed available.
  The v1 branch is bounded context; all typed registers describe v2 definitions.
resources:
  repos:
  - name: linux-gpio
    url: https://github.com/torvalds/linux
    commit: 8d3ae59288f1e7d58d76558a6ee96d533bc5019f
    license: GPL-2.0-only
    role: source
    status: merged
    files:
    - path: drivers/gpio/gpio-rockchip.c
      license_from: spdx-line
    - path: drivers/pinctrl/pinctrl-rockchip.h
      license_from: spdx-line
    - path: Documentation/devicetree/bindings/gpio/rockchip,gpio-bank.yaml
      license_from: spdx-line
    - path: kernel/irq/generic-chip.c
      license_from: spdx-line
    - path: include/linux/irq.h
      license_from: spdx-line
  - name: linux-dts
    url: https://github.com/torvalds/linux
    commit: 8d3ae59288f1e7d58d76558a6ee96d533bc5019f
    license: GPL-2.0-or-later OR MIT
    role: source
    status: merged
    files:
    - path: arch/arm64/boot/dts/rockchip/rk3588-base.dtsi
      license_from: spdx-line
facts:
- id: version-selection
  section: identity
  claim: Linux reads VERSION_ID at offset 0x78 after obtaining an enabled first clock. Exactly 0x01000c2b,
    0x0101157c and 0x010219c8 select gpio_regs_v2 and normalize gpio_type to GPIO_TYPE_V2. ID zero selects
    gpio_regs_v1; every other ID returns -ENODEV. The v2 map and split helpers below apply only to the
    three recognized nonzero IDs, not merely to the compatible string.
  requirement: as-implemented
  support:
  - class: src
    anchors:
    - repo: linux-gpio
      path: drivers/gpio/gpio-rockchip.c
      lines:
      - 34
      - 37
      symbol: GPIO_TYPE_V1
    - repo: linux-gpio
      path: drivers/gpio/gpio-rockchip.c
      lines:
      - 53
      - 69
      symbol: gpio_regs_v2
    - repo: linux-gpio
      path: drivers/gpio/gpio-rockchip.c
      lines:
      - 666
      - 695
      symbol: rockchip_get_bank_data
  critical: true
- id: bank-map
  section: identity
  claim: The pinned RK3588 device tree declares GPIO0 at 0xfd8a0000, GPIO1 at 0xfec20000, GPIO2 at 0xfec30000,
    GPIO3 at 0xfec40000 and GPIO4 at 0xfec50000; each window is 0x100 bytes. The respective interrupt
    tuples are GIC_SPI 277, 278, 279, 280 and 281, IRQ_TYPE_LEVEL_HIGH, trailing cell zero. These are
    source declarations, not measured placement or architectural INTIDs. Each bank maps local pins 0..31
    into pinctrl ranges starting 0, 32, 64, 96 and 128; clocks are first PCLK_GPIO0..4 and second DBCLK_GPIO0..4.
  requirement: as-implemented
  support:
  - class: DT
    anchors:
    - repo: linux-dts
      path: arch/arm64/boot/dts/rockchip/rk3588-base.dtsi
      lines:
      - 3533
      - 3591
      symbol: gpio0
  critical: true
- id: binding-clock-order
  section: identity
  claim: The Linux GPIO-bank binding permits rockchip,gpio-bank and rockchip,rk3188-gpio-bank0. It describes
    clocks in order as APB interface and optional GPIO debounce reference clock, one register resource
    and one interrupt. GPIO and interrupt cell counts are both two. This binding does not identify an
    actual silicon register revision.
  requirement: as-implemented
  support:
  - class: src
    anchors:
    - repo: linux-gpio
      path: Documentation/devicetree/bindings/gpio/rockchip,gpio-bank.yaml
      lines:
      - 12
      - 47
      symbol: properties
