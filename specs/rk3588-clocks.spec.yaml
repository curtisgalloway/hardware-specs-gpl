format: 2
kind: peripheral
id: rk3588-clocks
name: RK3588 UART2 and GPIO0–4 boot clock/reset subset
orientation: Hardware programming scope for standard ROCK 5T V1.2. Records state what pinned Linux defines
  and performs; public silicon programming authority and firmware state remain blocking gaps. Only immediate
  bounded source ancestry is included, without PLL programming or a full SoC clock tree. Other peripheral
  family references are deferred to integration.
