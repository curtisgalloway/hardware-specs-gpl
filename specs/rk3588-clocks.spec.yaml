- id: gate-update
  section: sequences
  claim: Pinned generic gate operations implement enabling, disabling and reading inverted highword-masked
    gates; the lock is taken only when supplied. These are independent operations, not a hardware-required
    boot order.
  requirement: as-implemented
  critical: true
  data:
    sequence:
      steps:
      - id: enable-disable
        action: For requested enable=1 or disable=0, compute set as SET_TO_DISABLE XOR enable; conditionally
          lock. With HIWORD_MASK write BIT(bit+16), adding BIT(bit) only when set is true. Unlock conditionally;
          gate enable returns zero.
        support:
        - class: src
          anchors:
          - repo: linux
            path: drivers/clk/clk-gate.c
            lines:
            - 56
            - 100
            symbol: clk_gate_endisable
      - id: enabled-read
        action: Read the register; when SET_TO_DISABLE is set, invert the selected bit before masking
          and returning whether it is nonzero.
        support:
        - class: src
          anchors:
          - repo: linux
            path: drivers/clk/clk-gate.c
            lines:
            - 108
            - 124
            symbol: clk_gate_is_enabled
