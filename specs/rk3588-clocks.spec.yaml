facts:
- id: cru-map
  section: identity
  claim: The pinned Linux device tree describes rockchip,rk3588-cru at address 0xfd7c0000 with a 0x5c000-byte
    region. All typed offsets below are relative to that mapping, including the PMU subdomain; this is
    device-tree evidence, not a measured board address.
  requirement: as-implemented
  critical: true
  support:
  - class: DT
    anchors:
    - repo: linux-dts
      path: arch/arm64/boot/dts/rockchip/rk3588-base.dtsi
      lines:
      - 742
      - 744
      symbol: cru
- id: input-rate-descriptions
  section: identity
  claim: The pinned Linux device tree describes fixed clocks xin24m at 24000000 Hz and xin32k at 32768
    Hz. These declarations do not measure oscillator accuracy, verify source stability, or establish the
    clocks selected by loaded firmware.
  requirement: as-implemented
  support:
  - class: DT
    anchors:
    - repo: linux-dts
      path: arch/arm64/boot/dts/rockchip/rk3588-base.dtsi
      lines:
      - 423
      - 435
      symbol: xin24m
- id: consumer-clock-pairs
  section: identity
  claim: The pinned Linux UART2 node names SCLK_UART2 as baudclk and PCLK_UART2 as apb_pclk. Its GPIO0–4
    nodes list PCLK_GPIOx first and DBCLK_GPIOx second. None of these node bodies contains a resets property;
    reset lookup entries below do not establish that these consumers request reset operations.
  requirement: as-implemented
  critical: true
  support:
  - class: DT
    anchors:
    - repo: linux-dts
      path: arch/arm64/boot/dts/rockchip/rk3588-base.dtsi
      lines:
      - 2811
      - 2824
      symbol: uart2
    - repo: linux-dts
      path: arch/arm64/boot/dts/rockchip/rk3588-base.dtsi
      lines:
      - 3533
      - 3591
      symbol: gpio0
