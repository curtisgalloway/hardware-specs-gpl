- id: mux-domain-branches
  section: gotchas
  title: RK3588 mux domain branches
  claim: For GPIO0 local 0–11, writes use R. For GPIO0 local 12–31 and mux<8, writes use R+0x4000-0xc.
    For those pins with mux>=8, Linux requests selector 8 at R+0x4000-0xc then the requested mux at R+0x8000,
    OR-combining both return values without aborting between requests. GPIO1–GPIO4 add 0x8000 to R, reject
    mux>15, then use the generic masked update path. The GPIO0 branches return before that generic range
    check.
  requirement: as-implemented
  support:
  - class: src
    anchors:
    - repo: linux-pinctrl
      path: drivers/pinctrl/pinctrl-rockchip.c
      lines:
