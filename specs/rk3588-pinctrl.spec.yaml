  claim: Each RK3588 calculator reverse scans its own threshold catalog using bank*32+local, returns regmap_base
    and the catalog byte offset, or -EINVAL when no threshold matches. Pull b=2*(local%8), width2; drive
    b=4*(local%4), width4; Schmitt b=local%8, width1. The original local pin determines the bit even across
    split thresholds; do not subtract the selected threshold.
