format: 2
kind: peripheral
id: rk3588-pinctrl
name: RK3588 pin control programming from Linux
orientation: Hardware-only ROCK 5T V1.2 campaign. Complete GPIO0–GPIO4 threshold catalogs and source mux
  branches; typed registers focus on UART2 m0. No driver was rebuilt or run. GPIO data/direction/interrupt
  controller programming is outside this peripheral. Tables use IOC-relative byte offsets; no electrical
  setting is recommended without board evidence.
