- id: mux-offset-calculation
  section: gotchas
  title: Mux index arithmetic
  claim: Derived RK3588 raw mux byte offset R=32*bank+8*floor(local/8)+4*(local%8>=4); bit b=4*(local%4),
    field mask F=15. All source groups select regmap_base. This is the closed-form specialization of the
    pinned allocation loop and setter, before the RK3588 domain displacement.
  requirement: as-implemented
  support:
  - class: inference
    confidence: high
    premises:
    - fact: '#mux-allocation-observations'
    - fact: '#pin-numbering'
    derivation: The source defines five successive 32-pin banks and four groups per bank, each advancing
      the shared GRF allocation counter by 8 from static initial value0. Four groups consume32 bytes,
      so bank starts at32*bank; local/8 selects its group and contributes8*floor(local/8). The setter
      adds4 only for local%8>=4, then uses4*(local%4) as bit and15 as mask. These flags choose regmap_base.
      Combine these source operations to obtain the formula; this establishes software indexing only.
  critical: true
  todo:
    check: source
    text: Independently recompute the closed-form index from the pinned allocation loop and four-bit setter.
    method: Enumerate GPIO0–GPIO4 and local pins0–31, compare loop-assigned group offsets and high-half
      adjustment with R and b; preserve the separate hardware access-contract gap.
  relates:
  - fact: '#mux-allocation-observations'
    relation: refines
  - fact: '#pin-numbering'
    relation: refines
- id: mux-allocation-observations
  section: gotchas
  title: Direct source mux allocation observations
  claim: RK3588_PIN_BANK_FLAGS repeats the supplied mux flag for four groups; PIN_BANK_IOMUX_FLAGS_PULL_FLAGS
    gives each group offset -1. RK3588 defines five successive 32-pin banks with IOMUX_WIDTH_4BIT and
    omits explicit grf_mux_offset, so that static field initializes to zero. The allocation loop starts
    at grf_mux_offset, assigns group offsets and advances by 8 for four-bit groups. The setter adds 4
    for local%8>=4, computes bit=(local%4)*4 and mask15, and selects regmap_base for these flags.
  requirement: as-implemented
  support:
  - class: src
    anchors:
    - repo: linux-pinctrl
