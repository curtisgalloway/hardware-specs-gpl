  critical: true
- id: mux-readback
  section: gotchas
  title: Mux readback differs from setter selection
  claim: For GPIO0 local 12–31, Linux reads R+0x4000-0xc and tests register BIT(8), not the selected pin
    nibble. If BIT(8) is clear it returns the selected PMU2 nibble; otherwise it reads R+0x8000. GPIO1–GPIO4
    read R+0x8000. Therefore this getter must not be silently replaced by testing the selected nibble
    for selector 8.
  requirement: as-implemented
  support:
  - class: src
    anchors:
    - repo: linux-pinctrl
