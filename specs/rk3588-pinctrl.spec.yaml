- id: console-pmu2-mux
  section: registers
  title: Derived UART2_M0_PMU2_SELECTOR
  claim: Derived Linux IOC-relative mux location and TX/RX field ranges for UART2 m0 GPIO0 B5/B6. The
    formal inference premises below identify the route, pin numbers and property-specific indexing. Offset
    and fields describe software indexing; hardware access width, reset and reserved-bit behavior remain
    unknown.
  requirement: as-implemented
  data:
    register:
      name: UART2_M0_PMU2_SELECTOR
      offset: '0x4000'
    fields:
    - id: tx-selector
      name: TX_SELECTOR
      bits:
      - 4
      - 7
      meaning: GPIO0 B5 TX field
    - id: rx-selector
      name: RX_SELECTOR
      bits:
      - 8
      - 11
      meaning: GPIO0 B6 RX field
  support:
  - class: inference
    confidence: high
    premises:
    - fact: '#uart2-routes'
    - fact: '#pin-numbering'
    - fact: '#mux-allocation-observations'
    - fact: '#mux-domain-branches'
    - fact: '#ioc-domain-offsets'
    derivation: For bank0 B5/B6, local13/14 lie in group1; the allocation gives group offset8, the high-half
      selector adds4, yielding raw offset12. bit=4*(13%4)=4 for TX and4*(14%4)=8 for RX; mask15 covers
      bits4–7 and8–11. For mux10>=8, PMU2 displacement0x4000-0xc gives12+0x4000-12=0x4000. This derives
      only the specialization of pinned Linux request indexing, not a hardware access contract or applied
      firmware state.
  critical: true
  relates:
  - fact: '#uart2-routes'
    relation: refines
  - fact: '#pin-numbering'
    relation: refines
  - fact: '#mux-allocation-observations'
    relation: refines
  - fact: '#mux-domain-branches'
    relation: refines
  - fact: '#ioc-domain-offsets'
    relation: refines
  todo:
