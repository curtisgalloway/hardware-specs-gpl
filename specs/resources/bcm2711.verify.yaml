    note: 'bcm2711.dtsi lines 56-66 (gicv2 node): interrupt-controller, #interrupt-cells = <3>, compatible
      arm,gic-400, reg regions 0x40041000/0x1000, 0x40042000/0x2000, 0x40044000, 0x40046000, interrupts
      GIC_PPI 9 with GIC_CPU_MASK_SIMPLE(4) | IRQ_TYPE_LEVEL_HIGH; all match the claim (4 KB, 8 KB,
      four CPUs, level-high flag). Lines 41-43 give the soc ranges entry 0x40000000 -> 0xFF800000
      size 8 MB, so the distributor and CPU interface translate to 0xFF84_1000 and 0xFF84_2000 as
      claimed (the checker''s "hex values absent" warning is this translation; both operands are in
      this fact''s own anchors and the claim states the translation basis, consistent with the related
      address-translation-in-the-tree fact). Binding lines 96-116 name the four reg regions in the
      claimed order (distributor, CPU interface, virtual interface control, virtual CPU interface)
      and describe interrupts on a primary GIC as the VGIC maintenance interrupt. PPI 9 -> ID 25 follows
      the 16 + n PPI offset; the docs root''s interrupt-ids-at-the-gic gives the virtual maintenance
      interrupt as PPI 25, and the GIC-400 TRM Table 2-3 (and section 2.3.3 text) names ID 25 the
      virtual maintenance interrupt; TRM memory map offsets 0x1000/0x2000/0x4000/0x6000 for distributor/CPU
      interface/virtual interface control/virtual CPU interface agree with the reg offsets. Licenses:
      bcm2711.dtsi and the binding carry SPDX GPL-2.0, consistent with the declared GPL-2.0-only.
      Contrary-evidence search: other gicv2 or interrupt-controller@40041000 definitions in arch/arm/boot/dts/broadcom
      (only bcm2711.dtsi defines it), root/soc cell overrides in bcm283x.dtsi (bcm2711.dtsi''s later
      2/1 root cells override bcm283x''s 1/1; soc child cells are 1), and the TRM''s PPI table; none
      conflicts. Note the level-high flag differs from the TRM''s active-low PPI inputs; the claim
      states only the tree''s encoding, so this is not a conflict (the separate ppi-flags-are-not-hardware-polarity
      fact covers it). Macro values in the dt-bindings headers were not read; the claim names the
      macros, not their numeric values.'
