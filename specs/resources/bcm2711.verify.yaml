  ppi-flags-are-not-hardware-polarity:
    basis: 9f647a8011d28df136af68b8908c2e6c6db79d9a7ea227dbbfea5cd75cddf0c8
    upstream:
      bcm2711@hardware-specs-docs#interrupt-ids-at-the-gic: dc2a16810cf2239d29eea67c93c7190b6b9b9fb9858da38d3c89a403b4d102be
