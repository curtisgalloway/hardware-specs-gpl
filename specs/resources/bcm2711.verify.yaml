    date: '2026-10-14'
    verifier: Claude Code subagent, claude-opus-5-5, Claude Code, session gpl-p1
    note: 'Premise 1: bcm2711.dtsi 64-65 encode the maintenance PPI level-high; 446-453 encode the
      four timer PPIs level-low; confirmed. Premise 2 (docs fact, checked at its source): GIC-400
      TRM 2.3.2 states all PPI signals are active-LOW level-sensitive. Premise 3: arm,gic.yaml 82-94
      says PPI configurability is implementation defined and often ignored in favor of the hardware
      default; confirmed. Conclusion follows: with every PPI documented active-low, the level-high
      flag on PPI 9 cannot be the input''s polarity, so the flags do not convey it, and the binding
      says writing them may have no effect. Wording note for the author: the derivation''s "the same
      inputs" should read "inputs of one documented polarity" (PPI 9 and the timer PPIs are different
      inputs; the maintenance PPI is internal per TRM 2.2). Contrary search: GIC-400 TRM register
      summary shows GICD_ICFGRn at 0xC04 (PPIs) as RO with reset 0x55540000 and 3.4.2 notes legacy
      bits read-only; this supports, not contradicts, the claim and could be added as a premise. The
      TODO (write GICD_ICFGR1 PPI bits and read back) can observe whether writes take effect; not
      performed.'
    contrary_evidence: none-found
    citation_precision: exact
