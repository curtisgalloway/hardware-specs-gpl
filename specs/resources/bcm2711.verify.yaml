    note: 'pcie-brcmstb.c (SPDX GPL-2.0+, matching the linux-pcie entry) lines 1023-1031, inside brcm_pcie_get_inbound_wins:
      the comment says the driver validates the inbound view even though it should trust the device
      tree, because of a hardware issue on early Raspberry Pi 4 (bcm2711) revisions whose firmware
      has to edit dma-ranges dynamically, due to a PCIe controller integration bug that prohibits
      access above the lower 3 GB. Lines 1056-1061: the check fails with -EINVAL when size is zero,
      the offset is misaligned to size, or the offset is above 2 GB and below 4 GB; the claim''s "rejects
