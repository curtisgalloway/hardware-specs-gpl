      search: grepped the driver for SZ_3G, 0xc0000000, 3GB and BCM2711-specific branches; BCM2711
      branches concern PERST# and burst size only, no fixed 3 GB window. The tree''s own comment (bcm2711.dtsi
      577-581) states the wrapper bug without a revision qualifier, which differs in emphasis but
      does not contradict the claim, which reports the driver''s comment. Raspberry Pi documentation
