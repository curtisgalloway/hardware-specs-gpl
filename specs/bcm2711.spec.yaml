- id: emmc2
  section: quick-facts
  title: EMMC2
  claim: |-
    `brcm,bcm2711-emmc2` at `0x7E34_0000` on SPI 126 (ID 158), clocked by
    `BCM2711_CLOCK_EMMC2`, sits on its own `emmc2bus`. The tree comments that EMMC2's DMA
