- id: take-pcie-dma-bounds-from-the-live-tree
  section: gotchas
  title: Take PCIe DMA bounds from the live tree
  claim: |-
    The unmodified tree limits PCIe inbound DMA to the
    first 3 GB, but firmware may rewrite `dma-ranges`, so derive the inbound window and the PCI bus
    addresses from the live tree's `dma-ranges`, and keep buffers within what each endpoint can
    address; assuming a fixed 3 GB can waste usable memory or give a device wrong addresses.
  support:
  - class: inference
    premises:
    - states: the tree's default window
      support:
      - class: DT
        anchors:
        - repo: linux
          path: arch/arm/boot/dts/broadcom/bcm2711.dtsi
          lines:
          - 577
          - 583
    - fact: '#the-3-gb-inbound-limit-is-a-default-tied-to-early-revisions'
      uses: the driver comment on firmware edits and early revisions
    derivation: a window the firmware can change must be read where the firmware leaves it
  todo:
    check: hardware
    text: |-
      dump `dma-ranges` of the PCIe node from the live tree on boards of different
      revisions and memory sizes.
orientation: |-
  Adds to the `bcm2711` spec in `hardware-specs-docs` the facts that only the Linux device trees
  state. Every BCM2711 device-tree file in Linux is `GPL-2.0` only, so these facts live here. Each
  fact's `support` anchors it to the file and lines of the `linux` entry above (Linux v7.2), and
  `relates` entries link a fact to the facts it qualifies in the other roots. Interrupt
  cells are the device tree's GIC cells: an SPI cell `n` is GIC interrupt ID `32 + n`, a PPI cell
  `n` is ID `16 + n`, which the cross-checks against the datasheet's IDs below bear out.
