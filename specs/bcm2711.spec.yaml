- id: pcie-and-the-soc-s-xhci
  section: quick-facts
  title: PCIe and the SoC's xHCI
  claim: |-
    `brcm,bcm2711-pcie` at bus `0x7D50_0000` on SPIs 147 (`pcie`)
    and 148 (`msi`), legacy INTA-INTD on SPIs 143-146 (IDs 175-178); outbound window CPU
    `0x6_0000_0000` to PCI `0xF800_0000`, 64 MB; the unmodified tree's inbound `dma-ranges` is an
    identity map of the first 3 GB, commented as a bug in the wrapper around the PCIe block. The
    SoC's own `brcm,bcm2711-xhci` controller at `0x7E9C_0000` (SPI 176, ID 208) is `disabled`; the
    tree comments that it shares a USB PHY with the DWC2 controller, that enabling both locks up,
    and that the bootloader decides which to enable. It is not the separate PCIe-attached USB 3.0
    controller of the Pi 4B and 400 boards, which the docs spec's USB bullet describes.
  support:
  - class: DT
    anchors:
    - repo: linux
      path: arch/arm/boot/dts/broadcom/bcm2711.dtsi
      lines:
      - 545
      - 618
  relates:
  - {fact: 'bcm2711@hardware-specs-docs#usb-controllers', relation: qualifies}
- id: the-3-gb-inbound-limit-is-a-default-tied-to-early-revisions
  section: quick-facts
  title: The 3 GB inbound limit is a default, tied to early revisions
  claim: |-
    The Linux driver's comment
    says the restriction comes from a PCIe integration bug on early Raspberry Pi 4 revisions and
    that firmware edits `dma-ranges` at run time; the driver checks the inbound window it reads
    from the tree rather than assuming one, and rejects an offset between 2 GB and 4 GB.
  support:
  - class: src
    anchors:
    - repo: linux-pcie
      path: drivers/pci/controller/pcie-brcmstb.c
      lines:
      - 1023
      - 1031
      symbol: brcm_pcie_get_inbound_wins
    - repo: linux-pcie
      path: drivers/pci/controller/pcie-brcmstb.c
      lines:
      - 1056
      - 1061
      symbol: pci_offset
- id: board-dependence
  section: quick-facts
  title: Board dependence
  claim: |-
    EMMC2 and GENET are `disabled` in the SoC file; the board files enable
    them and add what the SoC file lacks, supplies for EMMC2 and a PHY handle and `rgmii-rxid` mode
    for GENET, and the Pi 4B and CM4 files are separate. Take these from the board spec or the live
    tree.
  support:
  - class: DT
    anchors:
    - repo: linux
      path: arch/arm/boot/dts/broadcom/bcm2711.dtsi
      lines:
