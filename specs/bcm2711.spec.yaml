kind: overlay
facts:
- id: address-translation-in-the-tree
  critical: true
  section: quick-facts
  title: Address translation in the tree
  claim: |-
    The root uses two address cells and one size cell. The
    `soc` bus maps legacy `0x7E00_0000` (24 MB) to `0xFE00_0000`, `0x7C00_0000` (32 MB) to
    `0xFC00_0000`, and the ARM Local block, which the tree addresses as `0x4000_0000`, to
    `0xFF80_0000` (8 MB). Its `dma-ranges` maps bus `0xC000_0000` to physical `0x0` for 1 GB.
  support:
  - class: DT
    anchors:
    - repo: linux
      path: arch/arm/boot/dts/broadcom/bcm2711.dtsi
      lines:
      - 10
      - 11
    - repo: linux
      path: arch/arm/boot/dts/broadcom/bcm2711.dtsi
      lines:
      - 34
      - 45
- id: tree-describes-low-peripheral-mode
  critical: true
  section: quick-facts
  title: The tree describes Low Peripheral mode
  claim: The tree describes Low Peripheral mode.
  support:
  - class: inference
    premises:
    - fact: '#address-translation-in-the-tree'
      uses: the tree's physical targets
    - fact: bcm2711@hardware-specs-docs#addressing-model
      uses: Low Peripheral mode places Main peripherals at `0x0_FC00_0000`–`0x0_FF7F_FFFF` and ARM Local at `0x0_FF80_0000`
    derivation: the targets fall in those ranges, not in the full-map ranges at `0x4_7C00_0000` and `0x4_C000_0000`
  todo:
    check: hardware
    text: |-
      compare the live tree on a board booted
      with arm_peri_high=1.
- id: gic-node
  section: quick-facts
  title: GIC node
  claim: |-
    `arm,gic-400`, `#interrupt-cells = <3>`, with distributor `0x4004_1000`
    (4 KB), CPU interface `0x4004_2000` (8 KB), virtual interface control `0x4004_4000` and virtual
    CPU interface `0x4004_6000` in the `soc` bus's ARM Local range, so `0xFF84_1000` and
    `0xFF84_2000` for the first two; its maintenance interrupt is PPI 9 (ID 25), encoded with the
    `IRQ_TYPE_LEVEL_HIGH` flag on all four CPUs.
  support:
  - class: DT
    anchors:
    - repo: linux
      path: arch/arm/boot/dts/broadcom/bcm2711.dtsi
      lines:
      - 56
      - 66
- id: ppi-flags-are-not-hardware-polarity
  section: quick-facts
  title: PPI flags are not hardware polarity
  claim: |-
    The tree's PPI trigger flags (level-high on the
    maintenance interrupt, level-low on the timers) do not tell a driver the GIC-400's PPI input
    polarity, and a driver should not expect writing them to change it.
  support:
  - class: inference
    premises:
    - states: the tree encodes the maintenance PPI as level-high and the timer PPIs as level-low
      support:
      - class: DT
        anchors:
        - repo: linux
          path: arch/arm/boot/dts/broadcom/bcm2711.dtsi
          lines:
          - 64
          - 65
        - repo: linux
          path: arch/arm/boot/dts/broadcom/bcm2711.dtsi
          lines:
          - 446
          - 453
    - fact: bcm2711@hardware-specs-docs#interrupt-ids-at-the-gic
      uses: the GIC-400's PPI inputs are active-low level-sensitive
    - states: the GIC binding says PPI configurability is implementation defined and often ignored, with the hardware default used
      support:
      - class: src
        anchors:
        - repo: linux
          path: Documentation/devicetree/bindings/interrupt-controller/arm,gic.yaml
          lines:
          - 82
          - 94
          symbol: interrupt-cells
    derivation: one tree gives the same inputs two different flags, so at least one flag cannot be the input's polarity, and the binding says the setting may have no effect
  todo:
    check: hardware
    text: write the PPI configuration bits of GICD_ICFGR1 and read them back.
- id: architected-timer-and-pmu
  section: quick-facts
  title: Architected timer and PMU
  claim: |-
    `arm,armv8-timer` with PPIs 13, 14, 11 and 10 (IDs 29, 30, 27,
    26), all level-low on four CPUs; `arm,cortex-a72-pmu` on SPIs 16-19 (IDs 48-51), one per CPU.
  support:
  - class: DT
    anchors:
    - repo: linux
      path: arch/arm/boot/dts/broadcom/bcm2711.dtsi
      lines:
      - 435
      - 454
- id: cpu-nodes
  section: quick-facts
  title: CPU nodes
  claim: |-
    Four `arm,cortex-a72` CPUs with `reg` 0-3. Each CPU node carries
    `enable-method = "spin-table"` with `cpu-release-addr` `0xD8`, `0xE0`, `0xE8` and `0xF0`; the
    `cpus` node also carries `brcm,bcm2836-smp`, commented in the tree as for 32-bit Arm. The L1 data cache is described
    as 32 KB with 64-byte lines, the L1 instruction cache 48 KB, the shared L2 1 MB.
  support:
  - class: DT
    anchors:
    - repo: linux
      path: arch/arm/boot/dts/broadcom/bcm2711.dtsi
      lines:
      - 456
      - 542
- id: reserved-stub-page
  section: quick-facts
  title: Reserved stub page
  claim: |-
    A `/memreserve/` covers physical `0x0`-`0xFFF`, commented as where the
