- id: system-oscillator
  section: quick-facts
  title: System oscillator
  claim: |-
    The tree sets the `clk_osc` clock to 54 MHz. This is a declared value,
    consistent with the stub's counter frequency in the permissive overlay, not a measurement.
  support:
  - class: DT
    anchors:
    - repo: linux
      path: arch/arm/boot/dts/broadcom/bcm2711.dtsi
      lines:
