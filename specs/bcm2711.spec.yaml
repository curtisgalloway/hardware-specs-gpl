- id: memory-node
  section: quick-facts
  title: Memory node
  claim: |-
    The board-level include carries `memory@0` with a zero placeholder `reg`
    (`<0 0 0>`), commented as filled in by the bootloader; the CMA pool is limited to the first 1 GB, commented as needed
    because some devices can address only the lower 1 GB.
  support:
