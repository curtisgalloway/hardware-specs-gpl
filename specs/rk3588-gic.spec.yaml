        - class: src
          anchors:
          - repo: linux-gic
            path: drivers/irqchip/irq-gic-v3.c
            lines:
            - 1033
            - 1045
            symbol: __gic_populate_rdist
        - class: src
          anchors:
          - repo: linux-gic
            path: drivers/irqchip/irq-gic-v3.c
            lines:
            - 1062
