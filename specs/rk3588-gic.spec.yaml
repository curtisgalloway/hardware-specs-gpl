areas:
- area: Regular interrupt programming
  level: document-and-code
  note: Architecture lifecycle and requirements; source-defined bounded MMIO offsets/masks and Linux
    policy. Hardware applicability and firmware handoff remain gaps.
facts:
- id: architecture-interface
  section: identity
  claim: The bounded programming model is GICv3 with affinity routing and the AArch64 CPU system register
    interface. Distributor state routes SPIs; redistributors hold SGI/PPI configuration; each CPU
    interface serves one processing element (PE). This identifies an interface, not a GIC-600 product
    or revision.
  support:
  - class: standard
    doc: arm-ihi0069g.pdf
    at:
    - page: '32'
      section: '2.1'
  - class: standard
    doc: arm-ihi0069g.pdf
    at:
    - page: '48'
      section: 4.1.1
  - class: standard
    doc: arm-ihi0069g.pdf
    at:
    - page: '37'
      section: 2.3 Affinity routing
- id: rk3588-interface-applicability
  section: identity
  claim: The existing RK3588 device-tree evidence advertises arm,gic-v3, so this architectural interface
    is the selected software contract for integration. Actual register accessibility and silicon identity
    remain unmeasured.
  support:
  - class: inference
    premises:
    - fact: rk3588@hardware-specs-gpl#dt-gic-node
    derivation: The published device-tree compatible selects the GICv3 interface, without identifying
      an implementation product or establishing firmware access permissions.
  todo:
    check: hardware
    text: Validate the interface on the board using identification registers and the firmware handoff
      state.
- id: driver-scope
  section: identity
  claim: Linux header offsets describe a Non-secure, affinity-routing-enabled view; its comment excludes
    Secure-only and non-ARE registers. Sequences below record this Linux driver, not a universally
    mandatory boot recipe.
  support:
  - class: src
    anchors:
    - repo: linux-gic
      path: include/linux/irqchip/arm-gic-v3.h
      lines:
      - 9
      - 12
      symbol: Distributor registers
      comment: true
  requirement: comment-explained
