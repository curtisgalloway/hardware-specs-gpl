  data:
    sequence:
      steps:
      - id: validate
        action: Read distributor PIDR2, mask with 0xf0, accept 0x30 (v3) or 0x40 (v4), otherwise return
          ENODEV.
        support:
        - class: src
          anchors:
          - repo: linux-gic
            path: drivers/irqchip/irq-gic-v3.c
            lines:
            - 2077
            - 2080
            symbol: gic_validate_dist_version
        - class: src
