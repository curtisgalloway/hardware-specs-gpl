# SPDX-FileCopyrightText: 2026 contributors
# SPDX-License-Identifier: GPL-2.0-only
format: 2
kind: peripheral
id: rk3588-gic
name: RK3588 GICv3 regular interrupt boot programming
orientation: 'Terms: INTID is the architectural interrupt identifier; SPI is a shared peripheral interrupt;
  PPI is a per-CPU peripheral interrupt; SGI is a software-generated interrupt; PE is a processing
  element; RD and SGI are separate redistributor frames; RWP is Register Write Pending; SRE enables
  CPU system register access; EOI drops interrupt priority. See the repository glossary and the existing
  rk3588 SoC spec for instance placement. This bounded GPL peripheral combines public architecture
  with Linux observations. Reusable architecture IP composition is deferred to integration.'
resources:
  documents:
  - name: arm-ihi0069g.pdf
    class: standard
    title: Arm Generic Interrupt Controller Architecture Specification, GIC architecture version 3
      and version 4
    revision: Arm IHI 0069G ID011821
    url: https://developer.arm.com/documentation/ihi0069/latest
    retrieval:
    - url: https://documentation-service.arm.com/static/601412d54ccc190e5e681269
    sha256: f5461ced0b908141c87f655e602ff6340a90f14028ea009239c388ed69b78ac6
    pages: 930
    page_numbering: pdf
    access: public
    note: Non-confidential. Arm copyright and proprietary notices remain applicable; document bytes
      are not redistributed.
  repos:
  - name: linux-gic
    url: https://github.com/torvalds/linux
    commit: 8d3ae59288f1e7d58d76558a6ee96d533bc5019f
    license: GPL-2.0-only
    role: source
    files:
    - path: drivers/irqchip/irq-gic-v3.c
      license_from: spdx-line
    - path: include/linux/irqchip/arm-gic-v3.h
      license_from: spdx-line
    - path: arch/arm64/include/asm/arch_gicv3.h
      license_from: spdx-line
    - path: drivers/irqchip/irq-gic-common.c
      license_from: spdx-line
    - path: include/linux/irqchip/arm-gic.h
      license_from: spdx-line
