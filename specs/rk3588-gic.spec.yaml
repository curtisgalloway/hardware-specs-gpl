- id: wake-security-prerequisite
  section: gotchas
  claim: Architecture power-up requires clearing ProcessorSleep and waiting for ChildrenAsleep clear;
    a 1-to-0 ProcessorSleep transition while ChildrenAsleep is not 1 is unpredictable. With DS=0,
    WAKER is Secure and Non-secure accesses are read-as-zero/write-ignored. Verify firmware ownership
    rather than assuming a successful Non-secure zero read proves wake control.
  support:
  - class: standard
    doc: arm-ihi0069g.pdf
    at:
    - page: '711'
      section: 12.11.40
  - class: standard
    doc: arm-ihi0069g.pdf
    at:
    - page: '712'
      section: 12.11.40
  critical: true
  requirement: hw-required
- id: sleep-prerequisite
  section: gotchas
  claim: Before sleeping a PE, CPU physical interrupt-group enables must be zero; set ProcessorSleep
    and wait for ChildrenAsleep=1 before powerdown. Writes to CPU interface registers other than SRE
    are unpredictable while ProcessorSleep or ChildrenAsleep is 1.
  support:
  - class: standard
    doc: arm-ihi0069g.pdf
