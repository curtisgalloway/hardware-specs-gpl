            path: include/linux/irqchip/arm-gic-v3.h
            lines:
            - 100
            - 102
            symbol: GIC_PIDR2_ARCH_MASK
      - id: walk
        action: Validate each region PIDR2, read TYPER and try the frame. Explicit stride wins; otherwise
          advance two 64-KiB frames, with two more if VLPIS; stop on LAST or a single-frame region.
        support:
