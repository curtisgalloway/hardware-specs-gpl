- id: architecture-ack-eoi
  section: interrupts
  claim: A Group 1 acknowledge reads ICC_IAR1_EL1. Preserve its entire returned value for the corresponding
    EOIR1 write on the same PE. Priority drops occur in reverse acknowledge order. With EOImode 0,
    EOIR1 drops priority and deactivates; with EOImode 1, EOIR1 drops priority and DIR later deactivates.
    DIR without the corresponding EOI, or with mode 0, is unpredictable.
