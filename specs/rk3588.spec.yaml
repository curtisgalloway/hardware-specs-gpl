assumptions:
  - id: gic-is-gic600
    text: >-
      the RK3588's interrupt controller is an Arm GIC-600; the device tree says only
      `arm,gic-v3`, and no public Rockchip document read states the IP
    todo: {check: hardware, text: read GICD_IIDR's ProductID at 0xFE60_0000.}
facts:
  - id: dt-gic-node
    section: quick-facts
    title: GIC node
    critical: true
    claim: >-
      `arm,gic-v3` with the distributor at `0xfe600000` (64 KB) and the redistributors at
      `0xfe680000` (1 MB), two `arm,gic-v3-its` children at `0xfe640000` and `0xfe660000` (128 KB
      each), maintenance interrupt PPI 9, `#interrupt-cells = <4>` (the fourth cell a PPI
      partition: the A55s, and the A76s, are separate partitions), `mbi-alias` `0xfe610000` with
      `mbi-ranges = <424 56>`, and `dma-noncoherent`.
    support:
      - class: DT
        anchors:
          - {repo: linux-dts, path: arch/arm64/boot/dts/rockchip/rk3588-base.dtsi, lines: [2587, 2627], node: interrupt-controller@fe600000}
    relates:
      - {fact: "rk3588@hardware-specs-docs#gic-instance", relation: qualifies}

  - id: gic-frame-layout
    section: quick-facts
    title: Source-declared GIC address windows
    critical: true
    claim: The pinned RK3588 device tree declares a distributor window at 0xfe600000 of size 0x10000,
      a redistributor region at 0xfe680000 of size 0x100000, and ITS windows at 0xfe640000 and 0xfe660000,
      each size 0x20000. These declarations do not establish GIC-600 identity, redistributor count,
      implemented frame stride or per-core frame addresses.
    support:
    - class: DT
      anchors:
      - repo: linux-dts
        path: arch/arm64/boot/dts/rockchip/rk3588-base.dtsi
        lines:
        - 2589
        - 2590
        node: interrupt-controller@fe600000
      - repo: linux-dts
        path: arch/arm64/boot/dts/rockchip/rk3588-base.dtsi
        lines:
        - 2603
        - 2604
        node: msi-controller@fe640000
      - repo: linux-dts
        path: arch/arm64/boot/dts/rockchip/rk3588-base.dtsi
        lines:
        - 2611
        - 2612
        node: msi-controller@fe660000
    todo:
      check: hardware
      text: With authorized access and an established privilege/security contract, identify the implemented
        GIC and enumerate redistributors through GICR_TYPER and its Last/affinity fields using the
        programming spec; do not infer topology from region size.
    relates:
    - fact: rk3588-gic#exact-product-revision
      relation: qualifies
  - id: dt-timer-node
    section: quick-facts
    title: Architected timer node
    critical: true
    claim: >-
      `arm,armv8-timer` with `GIC_PPI` 13 (`sec-phys`), 14 (`phys`), 11 (`virt`), 10
      (`hyp-phys`) and 12 (`hyp-virt`), each flagged `IRQ_TYPE_LEVEL_HIGH`. The node carries no
      `clock-frequency` property.
    support:
      - class: DT
        anchors:
          - {repo: linux-dts, path: arch/arm64/boot/dts/rockchip/rk3588-base.dtsi, lines: [413, 421], node: timer}
    relates:
      - {fact: "rk3588@hardware-specs-docs#system-counter", relation: qualifies}

  - id: timer-rate-from-cntfrq
    section: quick-facts
    title: The kernel takes the timer rate from CNTFRQ_EL0
    critical: true
    claim: >-
      With this device tree the Linux arm64 kernel's architected-timer driver takes its rate from
      CNTFRQ_EL0, so the value firmware programs in that register is the timer frequency the
      kernel uses.
    support:
      - class: inference
        confidence: high
        premises:
          - fact: "#dt-timer-node"
            uses: the timer node has no clock-frequency property
          - states: the driver reads the clock-frequency property when present and otherwise uses the rate from CNTFRQ_EL0
            support:
              - class: src
                anchors:
                  - {repo: linux-timer, path: drivers/clocksource/arm_arch_timer.c, lines: [862, 870], symbol: arch_timer_of_configure_rate}
                  - {repo: linux-timer, path: drivers/clocksource/arm_arch_timer.c, lines: [1187, 1188], symbol: arch_timer_of_init}
        derivation: >-
          the node lacks the property, so the driver's fallback branch applies and the rate is
          the one read from CNTFRQ_EL0
    todo:
      check: hardware
      text: compare the kernel's reported timer frequency in its boot log with CNTFRQ_EL0 read at kernel entry.
    relates:
      - {fact: "#dt-timer-node", relation: refines}

  - id: dt-cpus
    section: quick-facts
    title: CPU nodes
    critical: true
    claim: >-
      Eight CPU nodes with `enable-method = "psci"`: `cpu@0`–`cpu@300` are `arm,cortex-a55`
      with `reg` `0x0`, `0x100`, `0x200`, `0x300`, and `cpu@400`–`cpu@700` are `arm,cortex-a76`
      with `reg` `0x400`–`0x700`. The `cpu-map` groups the four A55s as cluster0 and the A76s in
      pairs as cluster1 (`0x400`, `0x500`) and cluster2 (`0x600`, `0x700`).
    support:
      - class: DT
        anchors:
          - {repo: linux-dts, path: arch/arm64/boot/dts/rockchip/rk3588-base.dtsi, lines: [55, 96], node: cpus}
          - {repo: linux-dts, path: arch/arm64/boot/dts/rockchip/rk3588-base.dtsi, lines: [111, 115], node: cpu@100}
          - {repo: linux-dts, path: arch/arm64/boot/dts/rockchip/rk3588-base.dtsi, lines: [130, 134], node: cpu@200}
          - {repo: linux-dts, path: arch/arm64/boot/dts/rockchip/rk3588-base.dtsi, lines: [149, 153], node: cpu@300}
          - {repo: linux-dts, path: arch/arm64/boot/dts/rockchip/rk3588-base.dtsi, lines: [168, 172], node: cpu@400}
          - {repo: linux-dts, path: arch/arm64/boot/dts/rockchip/rk3588-base.dtsi, lines: [187, 191], node: cpu@500}
          - {repo: linux-dts, path: arch/arm64/boot/dts/rockchip/rk3588-base.dtsi, lines: [206, 210], node: cpu@600}
          - {repo: linux-dts, path: arch/arm64/boot/dts/rockchip/rk3588-base.dtsi, lines: [225, 229], node: cpu@700}

  - id: mpidr-values
    section: quick-facts
    title: MPIDR values
    critical: true
    claim: >-
      MPIDR_EL1 affinity of the cores is `0x000`, `0x100`, `0x200`, `0x300` for the four A55s and
      `0x400`–`0x700` for the four A76s: Aff1 is the core number 0–7 within the one cluster and
      Aff0 is 0. Boot CPU and PSCI `CPU_ON` target values follow from this.
    support:
      - class: inference
        confidence: high
        premises:
          - fact: "#dt-cpus"
            uses: the cpu nodes' reg values and compatibles
          - states: on arm64 a cpu node's reg cell bits [23:0] are MPIDR_EL1 bits [23:0]
            support:
              - class: src
                anchors:
                  - {repo: linux-gpl2, path: Documentation/devicetree/bindings/arm/cpus.yaml, lines: [64, 79], symbol: reg}
          - states: TF-A's RK3588 port has one cluster of eight cores and shifts the cluster bits by 8 to form a CPU id
            support:
              - class: src
                anchors:
                  - {repo: tf-a, path: plat/rockchip/rk3588/include/platform_def.h, lines: [42, 55], symbol: PLAT_RK_CLST_TO_CPUID_SHIFT}
        derivation: >-
          the reg values are the affinity fields; 0x100 steps put the core number in Aff1 with
          Aff0 zero, consistent with TF-A's single eight-core cluster
    todo:
      check: hardware
      text: read MPIDR_EL1 on each core after PSCI CPU_ON, including the MT bit (bit 24), which the device tree does not carry.
    relates:
      - {fact: "rk3588@hardware-specs-docs#cpu-mpidr", relation: refines}

  - id: dt-psci
    section: quick-facts
    title: PSCI node
    critical: true
    claim: >-
      The tree declares `arm,psci-1.0` with `method = "smc"`, so secondary cores are started with
      PSCI calls through SMC. SCMI (clocks, including the CPU clocks) is also reached through SMC,
      function ID `0x82000010`.
    support:
      - class: DT
        anchors:
          - {repo: linux-dts, path: arch/arm64/boot/dts/rockchip/rk3588-base.dtsi, lines: [401, 404], node: psci}
          - {repo: linux-dts, path: arch/arm64/boot/dts/rockchip/rk3588-base.dtsi, lines: [356, 372], node: scmi}
          - {repo: linux-dts, path: arch/arm64/boot/dts/rockchip/rk3588-base.dtsi, lines: [94, 98], node: cpu@0}
    todo:
      check: hardware
      text: the tree states what a kernel should use, not what the firmware implements; call PSCI_VERSION through SMC on a board.
    relates:
      - {fact: "rk3588@hardware-specs-docs#psci-not-documented", relation: qualifies}

  - id: dt-uart2-node
    section: quick-facts
    title: UART2 node
    critical: true
    claim: >-
      `rockchip,rk3588-uart` and `snps,dw-apb-uart` at `0xfeb50000` (size `0x100`), interrupt
      `GIC_SPI 333` level high, clocks `SCLK_UART2` (baud) and `PCLK_UART2` (APB), DMA channels
      10 (TX) and 11 (RX) of `dmac0`, `reg-shift = <2>` and `reg-io-width = <4>`. The SoC file
      selects the M1 pins; a board overrides that.
    support:
      - class: DT
        anchors:
          - {repo: linux-dts, path: arch/arm64/boot/dts/rockchip/rk3588-base.dtsi, lines: [2811, 2824], node: serial@feb50000}
    relates:
      - {fact: "rk3588@hardware-specs-docs#interrupt-map", relation: qualifies}
      - {fact: "rk3588@hardware-specs-docs#uart-programming-model", relation: qualifies}

  - id: dt-intids
    section: quick-facts
    title: GIC INTIDs of the tree's interrupts
    claim: >-
      The device-tree interrupt numbers above are relative to their type, not INTIDs. Adding 32
      to SPIs and 16 to PPIs gives INTID 365 for UART2 (`GIC_SPI 333`); 238, 235 and 237 for
      `sfc`, `sdmmc` and `sdhci` (SPIs 206, 203, 205); 29, 30, 27, 26 and 28 for the secure
      physical, physical, virtual, hypervisor physical and hypervisor virtual timers (PPIs 13,
      14, 11, 10, 12); and 25 for the GIC maintenance interrupt (PPI 9).
    support:
      - class: inference
        confidence: high
        premises:
          - fact: "#dt-uart2-node"
            uses: GIC_SPI 333
          - fact: "#dt-storage-nodes"
            uses: GIC_SPI 206, 203, 205
          - fact: "#dt-timer-node"
            uses: GIC_PPI 13, 14, 11, 10, 12
          - fact: "#dt-gic-node"
            uses: maintenance interrupt PPI 9
          - states: Linux's GICv3 driver turns a device-tree SPI number n into hwirq n + 32 and a PPI number n into hwirq n + 16
            support:
              - class: src
                anchors:
                  - {repo: linux-gpl2, path: drivers/irqchip/irq-gic-v3.c, lines: [1604, 1614], symbol: gic_irq_domain_translate}
        derivation: >-
          the GICv3 driver's hwirq is the INTID it programs into the distributor and
          redistributors, so each INTID is the tree's number plus the type's base (32 for SPI,
          16 for PPI)
    todo:
      check: hardware
      text: >-
        on a board, enable UART2's transmit-empty interrupt and read GICD_ISPENDR11 bit 13 (INTID
        365), and read the virtual timer's pending bit in GICR_ISPENDR0 (bit 27).

  - id: dt-uart2-m0-pins
    section: quick-facts
    title: UART2 M0 pin group
    critical: true
    claim: >-
      `uart2m0_xfer` puts GPIO0_B6 (RX) and GPIO0_B5 (TX) in function 10 with pull-ups.
    support:
      - class: DT
        anchors:
          - {repo: linux-dts, path: arch/arm64/boot/dts/rockchip/rk3588-base-pinctrl.dtsi, lines: [3212, 3218], node: uart2m0-xfer}
    relates:
      - {fact: "rk3588@hardware-specs-docs#uart2-pinmux", relation: qualifies}

  - id: linux-dw-uart-busy
    section: gotchas
    title: Linux treats the busy-detect interrupt as a quirk to clear.
    claim: >-
      The Linux driver's header comment says the DesignWare UART raises a busy-detect interrupt
      when LCR is written while busy, after which LCR must be rewritten and USR read. Its
      interrupt handler clears a busy-detect interrupt (IIR ID 7) by reading USR and returns.
    support:
      - class: src
        anchors:
          - {repo: linux, path: drivers/tty/serial/8250/8250_dw.c, lines: [8, 10], symbol: LCR, comment: true}
          - {repo: linux, path: drivers/tty/serial/8250/8250_dw.c, lines: [418, 424], symbol: dw8250_handle_irq}
    relates:
      - {fact: "rk3588@hardware-specs-docs#uart-programming-model", relation: qualifies}

  - id: dt-storage-nodes
    section: quick-facts
    title: Boot-storage nodes
    critical: true
    claim: >-
      `sfc` (`rockchip,sfc`) at `0xfe2b0000`, `GIC_SPI 206`; `sdmmc` (`rockchip,rk3588-dw-mshc`,
      `rockchip,rk3288-dw-mshc`) at `0xfe2c0000`, `GIC_SPI 203`, `fifo-depth = <0x100>`, up to
      200 MHz, clocked through SCMI; `sdhci` (`rockchip,rk3588-dwcmshc`) at `0xfe2e0000`, `GIC_SPI
      205`, 64 KB, with core, bus, AXI, block and timer clocks (core 200 MHz, timer 24 MHz) and
      resets, and `supports-cqe`. `sfc` and `sdmmc` are given 16 KB (`0x4000`) register windows.
    support:
      - class: DT
        anchors:
          - {repo: linux-dts, path: arch/arm64/boot/dts/rockchip/rk3588-base.dtsi, lines: [2387, 2396], node: spi@fe2b0000}
          - {repo: linux-dts, path: arch/arm64/boot/dts/rockchip/rk3588-base.dtsi, lines: [2398, 2411], node: mmc@fe2c0000}
          - {repo: linux-dts, path: arch/arm64/boot/dts/rockchip/rk3588-base.dtsi, lines: [2428, 2448], node: mmc@fe2e0000}
    relates:
      - {fact: "rk3588@hardware-specs-docs#storage-controllers", relation: qualifies}

  - id: dt-scmi-shmem
    section: quick-facts
    title: SCMI shared-memory reservation
    claim: >-
      The SoC file's only `reserved-memory` entry is the SCMI shared memory at physical `0x10f000`,
      `0x100` bytes, `no-map`.
    support:
      - class: DT
        anchors:
          - {repo: linux-dts, path: arch/arm64/boot/dts/rockchip/rk3588-base.dtsi, lines: [437, 447], node: reserved-memory}

  - id: tfa-memory-layout
    section: quick-facts
    title: TF-A memory layout
    critical: true
    claim: >-
      TF-A's RK3588 port defines trusted RAM as `TZRAM_BASE` 0 with `TZRAM_SIZE` `0x100000` (the
      first 1 MB of DRAM) and places BL31 from `TZRAM_BASE + 0x40000` up to `TZRAM_BASE +
      TZRAM_SIZE`. Its DDR shared-memory region starts at `SIZE_K(1024)` (the comment calls it
      "1M~2M"): 15 pages of 4 KB (`SHARE_MEM_PAGE_NUM`), then the 4 KB SCMI shared memory at
      `SHARE_MEM_BASE + SHARE_MEM_SIZE`, where `SIZE_K(n)` is `n * 1024`.
    support:
      - class: src
        anchors:
          - {repo: tf-a, path: plat/rockchip/rk3588/include/platform_def.h, lines: [71, 82], symbol: BL31_BASE}
          - {repo: tf-a, path: plat/rockchip/rk3588/rk3588_def.h, lines: [10, 10], symbol: SIZE_K}
          - {repo: tf-a, path: plat/rockchip/rk3588/rk3588_def.h, lines: [152, 165], symbol: SCMI_SHARE_MEM_BASE}
    scope:
      builds: [TF-A v2.14 (mainline)]

  - id: tfa-scmi-shmem-address
    section: quick-facts
    title: Where TF-A puts the SCMI shared memory
    critical: true
    claim: >-
      Mainline TF-A's RK3588 BL31 occupies `0x40000`–`0xFFFFF`, its shared memory starts at
      `0x100000`, and its SCMI shared memory is the 4 KB page at `0x10F000`–`0x10FFFF`, the
      address the device tree's `scmi_shmem` reservation gives.
    support:
      - class: inference
        confidence: high
        premises:
          - fact: "#tfa-memory-layout"
            uses: TZRAM 0 + 0x100000, BL31 from 0x40000, SHARE_MEM_BASE = SIZE_K(1024), 15 pages of SIZE_K(4), SCMI after them, SIZE_K(n) = n * 1024
          - fact: "#dt-scmi-shmem"
            uses: the tree's SCMI shared memory at 0x10f000
        derivation: >-
          BL31 ends at TZRAM_BASE + TZRAM_SIZE = 0x100000, so its last byte is 0xFFFFF;
          SIZE_K(1024) = 0x100000; 15 × 4 KB = 0xF000, so SCMI_SHARE_MEM_BASE = 0x10F000 and its
          4 KB ends at 0x10FFFF, matching the tree's 0x10f000
    todo:
      check: hardware
      text: >-
        under mainline TF-A, confirm the SCMI channel works with the tree's shmem at 0x10f000 (an
        SCMI clock rate read from Linux succeeds).
    scope:
      builds: [TF-A v2.14 (mainline)]

  - id: uboot-reserves-first-2mb
    section: quick-facts
    title: U-Boot reports DRAM from 2 MB
    critical: true
    claim: >-
      Mainline U-Boot starts the first DRAM bank it reports at `CFG_SYS_SDRAM_BASE + SZ_2M`, and
      `CFG_SYS_SDRAM_BASE` is 0 on the RK3588, so the first 2 MB of DRAM are kept out as reserved
      for BL31 even when the DRAM layout from the DDR blob includes them. Its comment says BL31
      reserves the first 2 MB. It also cuts holes for the reserved (non-DRAM) ranges of its own
      memory map. The fallback path without the blob's layout also starts at 2 MB.
    support:
      - class: src
        anchors:
          - {repo: u-boot, path: arch/arm/mach-rockchip/sdram.c, lines: [182, 185], symbol: rockchip_dram_init_banksize, comment: true}
          - {repo: u-boot, path: arch/arm/mach-rockchip/sdram.c, lines: [186, 189], symbol: CFG_SYS_SDRAM_BASE}
          - {repo: u-boot, path: arch/arm/mach-rockchip/sdram.c, lines: [191, 222], symbol: tmp_mem_map}
          - {repo: u-boot, path: arch/arm/mach-rockchip/sdram.c, lines: [321, 323], symbol: dram_init_banksize}
          - {repo: u-boot, path: include/configs/rk3588_common.h, lines: [14, 14], symbol: CFG_SYS_SDRAM_BASE}
    scope:
      builds: [U-Boot v2026.10 (mainline)]

  - id: uboot-memory-map
    section: quick-facts
    title: U-Boot's RK3588 memory map
    critical: true
    claim: >-
      U-Boot's `rk3588_mem_map` lists these regions as base and size: normal memory `0x0` +
      `0x10_F000`; normal non-cacheable `0x10_F000` + `0x1000` (its comment: the SCMI shared
      memory); normal `0x11_0000` + `0xEFEF_0000`; device `0xF000_0000` + `0x1000_0000`; normal
      `0x1_0000_0000` + `0x2_FC00_0000`, `0x3_FC50_0000` + `0x3A0_0000` and `0x4_0000_0000` +
      `0x4_0000_0000`; and device `0x9_0000_0000` + `0x1_5000_0000`. `CFG_SYS_SDRAM_BASE` is 0 and
      `SDRAM_MAX_SIZE` is `0xf0000000`, and `board_get_usable_ram_top` keeps U-Boot below the
      lower of `CFG_SYS_SDRAM_BASE + SDRAM_MAX_SIZE` and 4 GB.
    support:
      - class: src
        anchors:
          - {repo: u-boot-gpl2, path: arch/arm/mach-rockchip/rk3588/rk3588.c, lines: [63, 119], symbol: rk3588_mem_map}
          - {repo: u-boot, path: include/configs/rk3588_common.h, lines: [14, 15], symbol: SDRAM_MAX_SIZE}
          - {repo: u-boot, path: arch/arm/mach-rockchip/sdram.c, lines: [297, 303], symbol: board_get_usable_ram_top}
    scope:
      builds: [U-Boot v2026.10 (mainline)]
    relates:
      - {fact: "rk3588@hardware-specs-docs#address-map", relation: qualifies}

  - id: uboot-memory-map-ranges
    section: quick-facts
    title: U-Boot's RK3588 memory map as address ranges
    critical: true
    claim: >-
      Mainline U-Boot maps `0x0`–`0xEFFF_FFFF` as normal memory (`0x10F000`–`0x10FFFF`
      non-cacheable), `0xF000_0000`–`0xFFFF_FFFF` as device, normal memory `0x1_0000_0000`–
      `0x3_FBFF_FFFF`, `0x3_FC50_0000`–`0x3_FFEF_FFFF` and `0x4_0000_0000`–`0x7_FFFF_FFFF`, and
      device `0x9_0000_0000`–`0xA_4FFF_FFFF`. The map leaves out `0x3_FC00_0000`–`0x3_FC4F_FFFF`,
      and U-Boot's use of DRAM below 4 GB is capped at `0xF000_0000`.
    support:
      - class: inference
        confidence: high
        premises:
          - fact: "#uboot-memory-map"
            uses: each region's base and size, CFG_SYS_SDRAM_BASE 0 and SDRAM_MAX_SIZE
        derivation: >-
          each range runs from base to base + size - 1; the first three normal regions are
          contiguous (0x10F000 + 0x1000 = 0x110000, 0x110000 + 0xEFEF0000 = 0xF0000000); the
          region ending at 0x3_FC00_0000 and the one starting at 0x3_FC50_0000 leave the gap
          between them; DRAM below 4 GB ends at CFG_SYS_SDRAM_BASE (0) + SDRAM_MAX_SIZE
    todo:
      check: hardware
      text: run `bdinfo` and `meminfo` in mainline U-Boot on an RK3588 board and compare the printed regions.
    scope:
      builds: [U-Boot v2026.10 (mainline)]

  - id: uboot-load-addresses
    section: quick-facts
    title: U-Boot load addresses
    critical: true
    claim: >-
      Mainline U-Boot's RK3588 environment: `kernel_addr_r=0x02000000`, `fdt_addr_r=0x12000000`,
      `fdtoverlay_addr_r=0x12100000`, `ramdisk_addr_r=0x12180000`, `kernel_comp_addr_r=0x0a000000`
      with `kernel_comp_size=0x8000000`, `scriptaddr=0x00c00000` and `pxefile_addr_r=0x00e00000`.
    support:
      - class: src
        anchors:
          - {repo: u-boot, path: include/configs/rk3588_common.h, lines: [21, 31], symbol: ENV_MEM_LAYOUT_SETTINGS}
    scope:
      builds: [U-Boot v2026.10 (mainline)]

  - id: uboot-boot-targets
    section: quick-facts
    title: U-Boot boot order
    claim: >-
      Mainline U-Boot's default `boot_targets` on Rockchip is `mmc1 mmc0 nvme scsi usb pxe dhcp
      spi`, in that order. `mmc1` and `mmc0` are MMC device numbers, which each board's
      device-tree aliases assign to its controllers; the header does not say which medium each
      is. The RK3588 environment takes this list as `boot_targets`.
    support:
      - class: src
        anchors:
          - {repo: u-boot, path: include/configs/rockchip-common.h, lines: [16, 17], symbol: BOOT_TARGETS}
          - {repo: u-boot, path: include/configs/rk3588_common.h, lines: [33, 37], symbol: CFG_EXTRA_ENV_SETTINGS}
    scope:
      builds: [U-Boot v2026.10 (mainline)]

  - id: uboot-debug-uart-pinmux
    section: quick-facts
    title: U-Boot's early console pin setup
    critical: true
    claim: >-
      Mainline U-Boot's `board_debug_uart_init` for the RK3588 selects UART2 M0 in two levels: in
      `PMU2_IOC`'s `gpio0b_iomux_sel_h` it writes 8 ("refer to BUS_IOC") to the GPIO0_B5 field
      (bits 7:4) and the GPIO0_B6 field (bits 11:8), then in `BUS_IOC`'s `gpio0b_iomux_sel_h` it
      writes 10 to the same fields, selecting UART2_TX_M0 on GPIO0_B5 and UART2_RX_M0 on GPIO0_B6.
    support:
      - class: src
        anchors:
          - {repo: u-boot-gpl2, path: arch/arm/mach-rockchip/rk3588/rk3588.c, lines: [123, 134], symbol: GPIO0B5_UART2_TX_M0}
          - {repo: u-boot-gpl2, path: arch/arm/mach-rockchip/rk3588/rk3588.c, lines: [136, 152], symbol: board_debug_uart_init}
    relates:
      - {fact: "rk3588@hardware-specs-docs#uart2-pinmux", relation: qualifies}
    scope:
      builds: [U-Boot v2026.10 (mainline)]

  - id: uboot-spl-sets-cntfrq
    section: quick-facts
    title: U-Boot SPL programs CNTFRQ
    claim: >-
      Mainline U-Boot's SPL, unless the RK3588's high-precision timer is already enabled, writes
      `CONFIG_COUNTER_FREQUENCY` to CNTFRQ_EL0 and starts that timer counting from all ones.
    support:
      - class: src
        anchors:
          - {repo: u-boot-gpl2, path: arch/arm/mach-rockchip/rk3588/rk3588.c, lines: [162, 174], symbol: rockchip_stimer_init}
    scope:
      builds: [U-Boot v2026.10 (mainline)]

  - id: uboot-brom-boot-sources
    section: quick-facts
    title: Boot ROM boot sources as U-Boot reads them
    claim: >-
      Mainline U-Boot maps the RK3588 boot ROM's reported boot source to a device: eMMC to
      `/mmc@fe2e0000`, SPI flash on FSPI pin groups M0, M1 or M2 (source IDs 3, 4 and 6) to
      `/spi@fe2b0000/flash@0`, and SD to `/mmc@fe2c0000`. Its comment says the ID for SPI flash
      depends on the FSPI pin group, not the flash type.
    support:
      - class: src
        anchors:
          - {repo: u-boot-gpl2, path: arch/arm/mach-rockchip/rk3588/rk3588.c, lines: [44, 50], symbol: BROM_BOOTSOURCE_FSPI_M0, comment: true}
          - {repo: u-boot-gpl2, path: arch/arm/mach-rockchip/rk3588/rk3588.c, lines: [49, 61], symbol: boot_devices}
    scope:
      builds: [U-Boot v2026.10 (mainline)]
  - id: boot-console-dependency-trace
    section: quick-facts
    title: Console instance and prerequisites
    claim: The V1.2 console header pin 8 (TX, GPIO0 B5) and pin 10 (RX, GPIO0 B6) join UART2 M0, the source-declared UART2 instance
      at 0xfeb50000, and SCLK_UART2/PCLK_UART2. The UART programming, console mux sequence and clock/reset
      lifecycle describe the corresponding operations. This trace does not establish firmware state
      or make the unresolved hardware access/sequence prerequisites safe.
    critical: true
    support:
    - class: inference
      premises:
      - fact: rock5t@hardware-specs-docs#debug-console-is-uart2-m0
      - fact: '#dt-uart2-node'
      - fact: rk3588-uart#addressing
      - fact: rk3588-pinctrl#console-mux-sequence
      - fact: rk3588-clocks#consumer-clock-pairs
      - fact: rk3588-clocks#uart-clock-reset-lifecycle
      derivation: Join the board UART2_M0 pin labels to the pinned UART2 node and the programming facts
        whose operations target that same controller and pins.
    todo:
      check: hardware
      text: Confirm board V1.2 and the loaded firmware route, clock/divisor state and register access
        permissions before performing the cited operations; retain each peripheral prerequisite gap.
    relates:
    - fact: rock5t@hardware-specs-docs#debug-console-is-uart2-m0
      relation: qualifies
    - fact: '#dt-uart2-node'
      relation: qualifies
    - fact: rk3588-uart#addressing
      relation: qualifies
    - fact: rk3588-pinctrl#console-mux-sequence
      relation: qualifies
    - fact: rk3588-clocks#consumer-clock-pairs
      relation: qualifies
    - fact: rk3588-clocks#uart-clock-reset-lifecycle
      relation: qualifies
  - id: boot-interrupt-topology
    section: quick-facts
    title: Boot interrupt topology
    claim: UART2 is source-declared SPI 333; GPIO0–4 are source-declared SPIs 277–281. The architectural
      timer node declares sec-phys/phys/virt/hyp-phys/hyp-virt PPIs 13/14/11/10/12 and the GIC maintenance
      interrupt is PPI 9. The architectural numbering convention adds 32 to SPI numbers and 16 to PPI
      numbers; timer selection and privilege/security state remain prerequisites.
    critical: true
    support:
    - class: inference
      premises:
      - fact: '#dt-uart2-node'
      - fact: '#dt-timer-node'
      - fact: '#dt-gic-node'
      - fact: '#dt-intids'
      - fact: rk3588-gpio#bank-map
      - fact: arm-architectural-timer#ppi-selection
      - fact: rk3588-gic#interrupt-numbering
      derivation: Join the source-declared device interrupt tuples at their common GIC parent; use
        the existing driver translation fact for architectural numbering, not a raw-cell reinterpretation.
    todo:
      check: hardware
      text: Confirm the loaded device tree and usable timer/interrupt group at the intended exception
        level; enumerate actual GIC redistributors instead of assuming the region determines topology.
    relates:
    - fact: '#dt-uart2-node'
      relation: qualifies
    - fact: '#dt-timer-node'
      relation: qualifies
    - fact: '#dt-gic-node'
      relation: qualifies
    - fact: '#dt-intids'
      relation: qualifies
    - fact: rk3588-gpio#bank-map
      relation: qualifies
    - fact: arm-architectural-timer#ppi-selection
      relation: qualifies
    - fact: rk3588-gic#interrupt-numbering
      relation: qualifies
  - id: boot-gpio-ownership
    section: quick-facts
    title: GPIO bank and console ownership
    claim: GPIO0 B5/B6 belong to source-declared GPIO bank 0 but the V1.2 board uses them as the UART2
      console pins. GPIO use requires choosing GPIO mux ownership and checking the board load and electrical
      prerequisites. The linked GPIOv2 programming model applies only when the recognized VERSION_ID
      selects it; bank membership establishes neither the actual register version nor that a header pin is free.
    critical: true
    support:
    - class: inference
      premises:
      - fact: rock5t@hardware-specs-docs#debug-console-is-uart2-m0
      - fact: rk3588-gpio#bank-map
      - fact: rk3588-gpio#version-selection
      - fact: rk3588-gpio#actual-version-and-mmio
      - fact: rk3588-pinctrl#pin-numbering
      - fact: rk3588-pinctrl#gpio-input-output-sequence
      - fact: rk3588-pinctrl#board-electrical-and-ownership
      derivation: The board B5/B6 labels identify bank 0 pins; connect bank numbering to pin-controller
        ownership prerequisites without selecting an unused header pin.
    todo:
      check: hardware
      text: Check the exact V1.2 schematic net and attached load, current owner and supported electrical
        settings before selecting GPIO function or driving any pin.
    relates:
    - fact: rock5t@hardware-specs-docs#debug-console-is-uart2-m0
      relation: qualifies
    - fact: rk3588-gpio#bank-map
      relation: qualifies
    - fact: rk3588-gpio#version-selection
      relation: qualifies
    - fact: rk3588-gpio#actual-version-and-mmio
      relation: qualifies
    - fact: rk3588-pinctrl#pin-numbering
      relation: qualifies
    - fact: rk3588-pinctrl#gpio-input-output-sequence
      relation: qualifies
    - fact: rk3588-pinctrl#board-electrical-and-ownership
      relation: qualifies
  - id: boot-timer-instance-representation
    section: quick-facts
    title: Processor timer instance representation
    claim: The timer identity and interrupt topology are represented by ordinary facts linked below.
      The format 2 instance row models reg as an MMIO address or unknown null and irq as one tuple or unknown null, so it cannot faithfully
      describe the processor system-register timer interface and its several timer PPIs. No timer instance
      row or MMIO address is fabricated; this is a schema representation limit.
    todo:
      check: document
      text: Use the architectural timer programming spec and the SoC timer-node fact; a future schema
        must explicitly model system-register access and multiple interrupt choices before adding a
        row.
    relates:
    - fact: arm-generic-timer-ip@hardware-specs-docs#architecture-identity
      relation: qualifies
    - fact: arm-architectural-timer#processor-timer-scope
      relation: qualifies
    - fact: '#dt-timer-node'
      relation: qualifies
  - id: boot-cru-instance-representation
    section: quick-facts
    title: Clock/reset controller instance representation
    claim: The source-declared CRU identity and 0xfd7c0000 mapping are recorded by the clock programming
      fact below. The current instance irq field admits only an IRQ tuple or unknown null, without
      a distinct no-interrupt state. A CRU row is omitted rather than assigning an invented interrupt
      or treating this representation limit as unknown controller identity.
    todo:
      check: document
      text: Use the linked CRU mapping and bounded clock/reset programming spec; extend the schema
        to distinguish an absent interrupt from an unknown interrupt before adding this instance row.
    relates:
    - fact: rk3588-clocks#cru-map
      relation: qualifies
    - fact: rk3588-clocks#consumer-clock-pairs
      relation: qualifies
  - id: boot-pinctrl-instance-representation
    section: quick-facts
    title: Pin controller instance representation
    claim: The source-declared RK3588 pin controller accesses the IOC mapping through rockchip,grf.
      Its identity and the IOC window are recorded below. The current instance row cannot represent
      that indirect register resource together with an explicit no-interrupt state. No direct pin-controller
      MMIO instance or interrupt is fabricated; this is a schema limit.
    todo:
      check: document
      text: Use the linked controller identity and IOC mapping; extend the schema to express an indirect
        register provider and distinguish absent from unknown interrupts before adding an instance
        row.
    relates:
    - fact: rk3588-pinctrl#controller-identity
      relation: qualifies
    - fact: rk3588-pinctrl#ioc-dt-window
      relation: qualifies
